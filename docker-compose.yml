services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: symbolic-backend
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: symbolic-frontend
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend